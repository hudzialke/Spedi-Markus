name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,sync]"
      - run: python tools/public_export.py --check .
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          SPEDI_LANGUAGE: pl
